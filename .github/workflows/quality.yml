name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v
      - name: Check the editable showcase
        run: python -B scripts/deck_doctor.py examples/style-showcase.pptx --expected-slides 3 --strict
